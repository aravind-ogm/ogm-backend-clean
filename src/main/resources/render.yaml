services:
  - type: web
    name: spring-backend
    env: docker
    plan: free
    autoDeploy: true

    dockerfilePath: ./Dockerfile

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: SPRING_MAIL_USERNAME
        sync: false

      - key: SPRING_MAIL_PASSWORD
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: APP_BASE_URL
        value: https://ogm-backend.onrender.com

      - key: JAVA_VERSION
        value: 17
