# ===============================
# PROFILE
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
spring.mvc.favicon.enabled=false
# ===============================
# CORS
# ===============================
app.cors.allowed-origins=http://localhost:3000,https://ogm-backend-clean.onrender.com
# ===============================
# SESSION / COOKIES (OAuth safe)
# ===============================
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
# ===============================
# GOOGLE OAUTH2
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:OGM_SECRET_OGM_SECRET_OGM_SECRET_12345}
jwt.expiration=86400000
# ===============================
# MAIL (OTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# ===============================
# STORAGE
# ===============================
storage.location=uploads
storage.base-url=${APP_BASE_URL:http://localhost:8080}
# ===============================
# JACKSON
# ===============================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.web=INFO
logging.level.com.ogm.market=DEBUG
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.springframework.security=INFO
# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# ===============================
# DATABASE (H2 ? DEV)
# ===============================
spring.datasource.url=jdbc:h2:mem:ogmdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.platform=h2
spring.jpa.open-in-view=false
# ===============================
# HIBERNATE PERFORMANCE
# ===============================
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.generate_statistics=false
# ===============================
# TOMCAT
# ===============================
server.tomcat.connection-timeout=30s
logging.level.org.apache.catalina.connector.OutputBuffer=ERROR
logging.level.org.apache.catalina.connector.ClientAbortException=OFF
# ===============================
# STATIC
# ===============================
spring.web.resources.add-mappings=false
# OTP
otp.expiry.minutes=5
# Twilio WhatsApp
twilio.account.sid=ACxxxxxxxxxxxxxxxxxxxxx
twilio.auth.token=xxxxxxxxxxxxxxxxxxxx
twilio.whatsapp.from=whatsapp:+14155238886


