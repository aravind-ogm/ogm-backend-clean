spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --------------------
# SERVER (Cloud Run)
# --------------------
server.port=${PORT:8080}
server.address=0.0.0.0

# --------------------
# CORS
# --------------------
app.cors.allowed-origins=https://oneglobalmarketplace.com,https://www.oneglobalmarketplace.com

# --------------------
# SESSION
# --------------------
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# --------------------
# MAIL
# --------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --------------------
# STORAGE
# --------------------
storage.location=uploads
storage.base-url=${APP_BASE_URL:https://ogm-backend-clean-879813720468.asia-south1.run.app}

# --------------------
# LOGGING
# --------------------
logging.level.org.springframework.web=INFO
logging.level.com.ogm.market=DEBUG

# --------------------
# ACTUATOR (REQUIRED FOR CLOUD RUN)
# --------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# --------------------
# DATABASE (H2 for now)
# --------------------
spring.datasource.url=jdbc:h2:mem:ogmdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# --------------------
# CLOUD RUN IMPORTANT
# --------------------
spring.main.lazy-initialization=true
spring.lifecycle.timeout-per-shutdown-phase=30s
